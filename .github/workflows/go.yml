name: Go CI

on:
  push:
    branches: [ "main", "master", "version-develop" ]
  pull_request:
    branches: [ "main", "master", "version-develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Format check
      run: test -z "$(gofmt -l .)"

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race -count=1 ./...

    - name: Build
      run: go build -v ./...
